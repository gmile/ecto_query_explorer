name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - run: nix flake check --print-build-logs
